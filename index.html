{% extends "base.html" %}
{% block content %}
<h1>Student Registration</h1>
<p>Add the students who will use the attendance system.</p>

<form method="post" action="/add_student" class="card">
    <input name="roll_no" placeholder="Roll number" required>
    <input name="name" placeholder="Student name" required>
    <button>Add Student</button>
</form>

<h2>Registered Students</h2>
<table>
<tr><th>Roll No.</th><th>Name</th></tr>
{% for s in students %}
<tr><td>{{ s.roll_no }}</td><td>{{ s.name }}</td></tr>
{% else %}
<tr><td colspan="2">No students yet.</td></tr>
{% endfor %}
</table>
{% endblock %}
